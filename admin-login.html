<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SN Emerson</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            color: #333;
            width: 350px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-btn {
            width: 100%;
            background-color: #ea580c;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #c2410c;
        }

        .error {
            color: red;
            margin-bottom: 10px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Admin Login</h2>

    <!-- FIXED ERROR DIV ID -->
    <div class="error" id="loginError"></div>

    <form id="adminLoginForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="adminEmail" placeholder="Enter admin email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="adminPassword" placeholder="Enter password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>
    </form>
</div>

<!-- Firebase Config -->
<script type="module" src="js/firebase-config.js"></script>

<link rel="icon" type="image/png" href="img/logo%20new.png">

<!-- Admin Login Logic -->
<script type="module" src="js/admin-auth.js"></script>

</body>
</html>
